name: deploy

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "O que publicar"
        type: choice
        options: [ambos, front, back]
        default: ambos
      ref:
        description: "Branch, tag ou commit do repositório principal"
        required: true
        default: main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      - if: inputs.alvo != 'back'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Front
        if: inputs.alvo != 'back'
        env:
          EDGE_MODE: cloudflare
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: scripts/deploy-frontend.sh

      - name: Login no ECR
        id: ecr
        if: inputs.alvo != 'front'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Imagem do backend
        id: image
        if: inputs.alvo != 'front'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="$(git -C backend rev-parse --short=12 HEAD)"
          IMAGE="$REGISTRY/moneylog-backend:$TAG"
          if aws ecr describe-images --repository-name moneylog-backend --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "a tag $TAG já existe no ECR (imutável): não reenvia"
          else
            docker buildx build --platform linux/amd64 -t "$IMAGE" --push backend
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Atualiza o backend na instância
        if: inputs.alvo != 'front'
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          CMD_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "moneylog deploy $TAG" \
            --parameters "commands=[\"export HOME=/root; bash /root/instance-setup.sh app $TAG\"]" \
            --query Command.CommandId --output text)"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
          [ "$STATUS" = "Success" ]
