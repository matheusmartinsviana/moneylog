# Exemplo de produção local/servidor único (T175): backend (perfil prod) + Postgres. SEM segredos neste arquivo:
# tudo vem do .env (copie de backend/.env.example) ou de arquivos em ./secrets (Docker secrets, opcional).
#   docker compose -f docker-compose.prod.yml --env-file backend/.env up --build
# O perfil prod não sobe sem JWT_SECRET, MONEYLOG_OWNER_*, DB_* e MONEYLOG_TRUSTED_PROXIES.
# Em produção na AWS o Postgres é o RDS (ADR-005): remova o serviço `postgres` e aponte DB_URL para o RDS.
name: moneylog-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - moneylog-prod-pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: backend
    image: moneylog-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      MONEYLOG_OWNER_EMAIL: ${MONEYLOG_OWNER_EMAIL:?defina MONEYLOG_OWNER_EMAIL no .env}
      MONEYLOG_OWNER_PASSWORD_HASH: ${MONEYLOG_OWNER_PASSWORD_HASH:-}
      # Primeiro acesso (ADR-015): código de uso único (use secret/arquivo em produção) e reset de uso único.
      MONEYLOG_OWNER_SETUP_CODE: ${MONEYLOG_OWNER_SETUP_CODE:-}
      MONEYLOG_OWNER_RESET_PASSWORD: ${MONEYLOG_OWNER_RESET_PASSWORD:-false}
      MONEYLOG_ALLOWED_ORIGINS: ${MONEYLOG_ALLOWED_ORIGINS:?defina MONEYLOG_ALLOWED_ORIGINS no .env}
      # Atrás do proxy do compose/ALB. Local: a rede interna do Docker (172.16.0.0/12).
      MONEYLOG_TRUSTED_PROXIES: ${MONEYLOG_TRUSTED_PROXIES:?defina MONEYLOG_TRUSTED_PROXIES no .env}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-50}
      AI_MONTHLY_TOKEN_BUDGET: ${AI_MONTHLY_TOKEN_BUDGET:-500000}
      AI_PAYLOAD_RETENTION_DAYS: ${AI_PAYLOAD_RETENTION_DAYS:-90}
      AI_TRANSCRIBE_MODEL: ${AI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      AI_MONTHLY_AUDIO_SECONDS: ${AI_MONTHLY_AUDIO_SECONDS:-1800}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-kapso}
      WHATSAPP_DISPATCH_ENABLED: ${WHATSAPP_DISPATCH_ENABLED:-false}
      WHATSAPP_TEMPLATES_ENABLED: ${WHATSAPP_TEMPLATES_ENABLED:-false}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      WHATSAPP_TEMPLATE_INVOICE_DUE: ${WHATSAPP_TEMPLATE_INVOICE_DUE:-}
      WHATSAPP_TEMPLATE_DEBT_PAYABLE_DUE: ${WHATSAPP_TEMPLATE_DEBT_PAYABLE_DUE:-}
      WHATSAPP_TEMPLATE_RECURRENCE_PENDING: ${WHATSAPP_TEMPLATE_RECURRENCE_PENDING:-}
      WHATSAPP_TEMPLATE_WEEKLY_SUMMARY: ${WHATSAPP_TEMPLATE_WEEKLY_SUMMARY:-}
      WHATSAPP_TEMPLATE_NEW_LOGIN: ${WHATSAPP_TEMPLATE_NEW_LOGIN:-}
      WHATSAPP_TEMPLATE_QUICK_TOKEN_CREATED: ${WHATSAPP_TEMPLATE_QUICK_TOKEN_CREATED:-}
      WHATSAPP_TEMPLATE_PASSWORD_RESET: ${WHATSAPP_TEMPLATE_PASSWORD_RESET:-}
      KAPSO_API_KEY: ${KAPSO_API_KEY:-}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET:-}
      KAPSO_WEBHOOK_SECRET_PREVIOUS: ${KAPSO_WEBHOOK_SECRET_PREVIOUS:-}
      KAPSO_BASE_URL: ${KAPSO_BASE_URL:-https://api.kapso.ai/meta/whatsapp/v24.0}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-}
      WHATSAPP_DAILY_OUTBOUND_LIMIT: ${WHATSAPP_DAILY_OUTBOUND_LIMIT:-5}
      WHATSAPP_WEBHOOK_QUEUE_SIZE: ${WHATSAPP_WEBHOOK_QUEUE_SIZE:-100}
      WHATSAPP_WEBHOOK_SIGNATURE_FAILURES_PER_IP: ${WHATSAPP_WEBHOOK_SIGNATURE_FAILURES_PER_IP:-120}
      WHATSAPP_SECURITY_QUEUE_SIZE: ${WHATSAPP_SECURITY_QUEUE_SIZE:-50}
      WHATSAPP_AUDIO_MAX_SECONDS: ${WHATSAPP_AUDIO_MAX_SECONDS:-60}
      WHATSAPP_AUDIO_MAX_BYTES: ${WHATSAPP_AUDIO_MAX_BYTES:-1048576}
      WHATSAPP_MEDIA_ALLOWED_HOSTS: ${WHATSAPP_MEDIA_ALLOWED_HOSTS:-}
      WHATSAPP_PHONE_PEPPER: ${WHATSAPP_PHONE_PEPPER:-}
      WHATSAPP_PHONE_ENC_KEY: ${WHATSAPP_PHONE_ENC_KEY:-}
      WHATSAPP_PHONE_ENC_KEYS_PREVIOUS: ${WHATSAPP_PHONE_ENC_KEYS_PREVIOUS:-}
      MONEYLOG_WHATSAPP_MAX_AMOUNT: ${MONEYLOG_WHATSAPP_MAX_AMOUNT:-}
      MONEYLOG_WHATSAPP_MAX_ENTRIES_PER_DAY: ${MONEYLOG_WHATSAPP_MAX_ENTRIES_PER_DAY:-}
      MONEYLOG_WHATSAPP_MAX_EXPENSE_PER_DAY: ${MONEYLOG_WHATSAPP_MAX_EXPENSE_PER_DAY:-}
      MONEYLOG_WHATSAPP_MAX_INCOME_PER_DAY: ${MONEYLOG_WHATSAPP_MAX_INCOME_PER_DAY:-}
      SPRING_TASK_SCHEDULING_POOL_SIZE: ${SPRING_TASK_SCHEDULING_POOL_SIZE:-1}
      MONEYLOG_PUSH_VAPID_PUBLIC: ${MONEYLOG_PUSH_VAPID_PUBLIC:-}
      MONEYLOG_PUSH_VAPID_PRIVATE: ${MONEYLOG_PUSH_VAPID_PRIVATE:-}
      MONEYLOG_PUSH_VAPID_SUBJECT: ${MONEYLOG_PUSH_VAPID_SUBJECT:-}
      MONEYLOG_PUSH_ENABLED: ${MONEYLOG_PUSH_ENABLED:-false}
      MONEYLOG_BACKUP_ENABLED: ${MONEYLOG_BACKUP_ENABLED:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_STORAGE: ${BACKUP_STORAGE:-local}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-moneylog/}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 3 * * *}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-none}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_SES_REGION: ${MAIL_SES_REGION:-us-east-1}
      MAIL_SES_CONFIGURATION_SET: ${MAIL_SES_CONFIGURATION_SET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - moneylog-prod-backups:/var/backups/moneylog
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp

networks:
  internal:

volumes:
  moneylog-prod-pgdata:
  moneylog-prod-backups:
