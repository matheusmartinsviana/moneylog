<header class="wh" [class.wh--home]="onHome()" data-cy="workspace-header">
  @if (onHome()) {
    <div class="wh__greeting">
      <p class="wh__hello" data-cy="workspace-greeting">{{ greeting() }}</p>
      <p class="wh__subtitle" data-cy="workspace-subtitle">{{ t().header.subtitle }}</p>
    </div>
  }

  <!-- A busca e o menu do perfil carregam num chunk à parte: o shell abre sem esperar o código dos popovers. -->
  @defer (on immediate) {
    <app-global-search class="wh__search" />
  } @placeholder {
    <div class="wh__search wh__search--placeholder" aria-hidden="true"></div>
  }

  <div class="wh__status">
    <button
      type="button"
      class="icon-button wh__bell"
      appLiquidGlass
      data-cy="header-theme-toggle"
      [attr.aria-label]="themeLabel()"
      [appTooltip]="themeLabel()"
      (click)="cycleTheme()"
    >
      <app-icon [name]="themeIcon()" [size]="20" />
    </button>
    <a
      class="icon-button wh__bell"
      appLiquidGlass
      routerLink="/notifications"
      data-cy="header-bell"
      [attr.aria-label]="bellLabel()"
    >
      <app-icon name="bell" [size]="20" />
      @if ((unreadCount() ?? 0) > 0) {
        <span class="wh__bell-count num" aria-hidden="true" data-cy="header-bell-count">{{
          unreadCount()
        }}</span>
      }
    </a>
    <app-chip
      [label]="aiStatus.enabled() ? t().header.aiOn : t().header.aiOff"
      cy="header-ai-status"
    />
    @defer (on immediate) {
      <app-profile-menu class="wh__profile" cy="header-profile" />
    } @placeholder {
      <span class="wh__avatar-placeholder" aria-hidden="true"></span>
    }
  </div>
</header>
