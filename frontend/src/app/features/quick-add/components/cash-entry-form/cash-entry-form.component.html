<form
  class="form surface"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  [attr.data-cy]="type() === 'EXPENSE' ? 'expense-form' : 'income-form'"
>
  <app-money-input
    formControlName="amount"
    fieldId="entry-amount"
    [currency]="currency"
    [label]="t().entryForm.amount"
  />
  <app-text-field
    formControlName="description"
    fieldId="entry-description"
    autocomplete="off"
    [maxlength]="200"
    [label]="t().entryForm.description"
  />
  <app-select
    formControlName="categoryId"
    fieldId="entry-category"
    [options]="categoryOptions()"
    [label]="t().entryForm.category"
  />
  <app-select
    formControlName="accountId"
    fieldId="entry-account"
    [options]="accountOptions()"
    [label]="t().entryForm.account"
  />
  <app-date-picker formControlName="date" fieldId="entry-date" [label]="t().entryForm.date" />
  @if (fixedMethod() === null) {
    <app-select
      formControlName="method"
      fieldId="entry-method"
      [options]="methodOptions()"
      [label]="t().entryForm.method"
    />
  }

  @if (showSplit()) {
    <app-switch
      [formControl]="split"
      fieldId="entry-split"
      [label]="t().lending.shares.toggle"
      [hint]="t().lending.shares.hint"
    />
    @if (splitting()) {
      <app-shares-field
        [array]="form.controls.shares"
        [people]="people()"
        [createPerson]="createPerson()"
        [currency]="currency"
      />
    }
  }

  @if (showLoanHint()) {
    <p class="form__help" data-cy="pix-loan-hint">
      {{ t().entryForm.pixLoanHint }}
      <a
        class="form__link"
        data-cy="pix-loan-link"
        routerLink="/quick-add"
        [queryParams]="loanLinkParams()"
        >{{ t().entryForm.pixLoanLink }}</a
      >
    </p>
  }

  <app-form-actions
    [banner]="banner()"
    [canRetry]="canRetry()"
    [saving]="saving()"
    [submitLabel]="submitLabel()"
    [cancelLink]="cancelLink()"
    (retry)="retry.emit()"
  />
</form>
