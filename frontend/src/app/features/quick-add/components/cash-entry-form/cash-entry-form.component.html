<form
  class="form"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  [attr.data-cy]="type() === 'EXPENSE' ? 'expense-form' : 'income-form'"
>
  <app-money-input
    formControlName="amount"
    fieldId="entry-amount"
    [currency]="currency"
    [label]="t().entryForm.amount"
  />
  <app-text-field
    formControlName="description"
    fieldId="entry-description"
    autocomplete="off"
    [maxlength]="200"
    [mandatory]="false"
    [hint]="t().entryForm.optionalHint"
    [label]="t().entryForm.description"
  />
  @if (loaning()) {
    <app-person-field
      [control]="form.controls.personId"
      fieldId="entry-person"
      [people]="people()"
      [createPerson]="createPerson()"
    />
  } @else {
    <app-select
      formControlName="categoryId"
      fieldId="entry-category"
      [options]="categoryOptions()"
      [mandatory]="false"
      [emptyLabel]="t().entryForm.noCategory"
      [label]="t().entryForm.category"
    />
  }
  <app-select
    formControlName="accountId"
    fieldId="entry-account"
    [options]="accountOptions()"
    [label]="t().entryForm.account"
  />
  <app-date-picker formControlName="date" fieldId="entry-date" [label]="t().entryForm.date" />
  @if (fixedMethod() === null) {
    <app-select
      formControlName="method"
      fieldId="entry-method"
      [options]="methodOptions()"
      [mandatory]="false"
      [emptyLabel]="t().transactions.methods.OTHER"
      [label]="t().entryForm.method"
    />
  }

  @if (showLoanSwitch()) {
    <app-switch [formControl]="loan" fieldId="entry-loan" [label]="t().entryForm.pixLoanToggle" />
  }

  @if (showSplit()) {
    <app-switch [formControl]="split" fieldId="entry-split" [label]="t().lending.shares.toggle" />
    @if (splitting()) {
      <app-shares-field
        [array]="form.controls.shares"
        [people]="people()"
        [createPerson]="createPerson()"
        [currency]="currency"
      />
    }
  }

  <app-form-actions
    [banner]="banner()"
    [canRetry]="canRetry()"
    [saving]="saving()"
    [submitLabel]="submitLabel()"
    [cancelLink]="cancelLink()"
    (retry)="retry.emit()"
  />
</form>
