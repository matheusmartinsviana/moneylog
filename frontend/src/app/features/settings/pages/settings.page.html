<app-page-layout reading [heading]="t().nav.settings">
  <div class="settings">
    <app-section-container [heading]="t().settings.preferences">
      <div class="preferences">
        <app-select
          [formControl]="languageControl"
          fieldId="settings-language"
          [label]="t().settings.language"
          [options]="languageOptions()"
        />
        <app-select
          [formControl]="themeControl"
          fieldId="settings-theme"
          [label]="t().settings.theme"
          [options]="themeOptions()"
        />
      </div>
    </app-section-container>

    <app-section-container [heading]="t().auth.session.title">
      <button
        type="button"
        class="button"
        data-cy="settings-sign-out"
        [disabled]="signingOut()"
        (click)="signOut()"
      >
        {{ signingOut() ? t().auth.session.signingOut : t().auth.session.signOut }}
      </button>
    </app-section-container>

    <nav class="links" [attr.aria-label]="t().brief.settingsLinks">
      <a class="pill" routerLink="/settings/categories" data-cy="settings-categories-link">
        {{ t().categories.settingsLink }}
      </a>
      <a class="pill" routerLink="/settings/notifications" data-cy="settings-notifications-link">
        {{ t().notifications.settings.title }}
      </a>
      <a class="pill" routerLink="/ai" data-cy="settings-ai-link">{{ t().nav.ai }}</a>
      <a class="pill" routerLink="/vault" data-cy="settings-vault-link">
        {{ t().workspacePages.vault.cardTitle }}
      </a>
    </nav>

    <app-disclosure
      class="settings__more"
      fieldId="settings-more"
      [heading]="t().brief.more"
      [headingLevel]="2"
    >
      <div class="settings__more-body">
        <app-export-section />
        <app-vault-section />
        <app-empty-state
          [heading]="t().emptyState.settings.title"
          [description]="t().emptyState.settings.description"
          [actions]="actions()"
          illustration="document"
        />
      </div>
    </app-disclosure>
  </div>
</app-page-layout>
