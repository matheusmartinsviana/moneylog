<div class="ladder" data-cy="goal-ladder">
  <p class="ladder__intro">{{ t().goals.ladder.intro }}</p>
  <ol class="ladder__steps" [attr.aria-label]="t().goals.ladder.title" appStagger>
    @for (step of steps(); track step.stage) {
      <li
        class="ladder__step row-card"
        [attr.data-state]="step.state"
        [attr.aria-current]="step.state === 'current' ? 'step' : null"
        [attr.data-cy]="'goal-stage-' + step.stage"
      >
        <span class="glyph ladder__glyph"><app-icon [name]="step.icon" [size]="18" /></span>
        <span class="ladder__text">
          <span class="ladder__label">{{ step.label }}</span>
          <span class="ladder__desc">{{ step.description }}</span>
        </span>
        <span class="status" [attr.data-tone]="step.state === 'todo' ? null : 'positive'">
          {{ step.stateLabel }}
        </span>
      </li>
    }
  </ol>
  <p class="ladder__hint" data-cy="goal-ladder-hint">{{ hint() }}</p>
</div>
